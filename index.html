<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariana Jaramillo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b1120 0%, #162447 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 36px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(14, 165, 233, 0.35);
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .btn-linkedin {
            background-color: #0a66c2;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(10, 102, 194, 0.3);
        }

        .btn-linkedin:hover {
            background-color: #004182;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 102, 194, 0.45);
        }

        .btn-email {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
        }

        .btn-email:hover {
            background-color: #334155;
            color: #38bdf8;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        footer {
            margin-top: 30px;
            font-size: 0.78rem;
            color: #64748b;
        }

        footer span {
            color: #38bdf8;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="avatar-container">
            <div class="avatar">
                <img src="profile.png" alt="Mariana Jaramillo">
            </div>
        </div>

        <h1>Mariana Jaramillo</h1>
        <p class="subtitle">Desarrolladora de Software</p>

        <div class="links">
            <a href="https://www.linkedin.com/in/mariana-jaramillo-a498a4316/" target="_blank" rel="noopener noreferrer"
                class="link-btn btn-linkedin">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path
                        d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45c-.9 0-1.63.73-1.63 1.63 0 .9.73 1.63 1.63 1.63.9 0 1.63-.73 1.63-1.63 0-.9-.73-1.63-1.63-1.63z" />
                </svg>
                LinkedIn
            </a>

            <a href="mailto:marianajaramillo.20055@gmail.com" class="link-btn btn-email">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path
                        d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                </svg>
                Contáctame por Correo
            </a>
        </div>

        <footer>
            Servido con <span>Nginx</span> en <span>Docker</span>
        </footer>
    </div>

</body>

</html>
